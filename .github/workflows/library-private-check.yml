name: Private Library verification
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary browser test dependencies
        run: |
          mkdir -p /tmp/library-browser-check
          cd /tmp/library-browser-check
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Verify full backup and unchanged export without logging private contents
        run: node scripts/library-private-check.cjs
