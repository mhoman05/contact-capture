name: Deploy worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
    steps:
      - name: Check the secrets
        id: check
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY NOTION_TOKEN CAPTURE_TOKEN; do
            if [ -n "${!n}" ]; then
              echo "$n: set"
            else
              echo "$n: MISSING"
              missing="$missing $n"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          secrets: |
            ANTHROPIC_API_KEY
            NOTION_TOKEN
            CAPTURE_TOKEN

      - name: Verify authenticated Library export against existing rows
        if: steps.check.outputs.ready == 'true'
        run: |
          node --input-type=module <<'JS'
          const base='https://contact-capture.matthias-homan.workers.dev';
          const booksDb='41ce528fadf881bcab50cfd5b8a27903',ideasDb='41ce528fadf8816aaf42eba6d9f5b690';
          const plain=p=>(p?.rich_text??p?.title??[]).map(t=>t.plain_text??t.text?.content??'').join('');
          async function notion(db,body){let r=await fetch('https://api.notion.com/v1/databases/'+db+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.NOTION_TOKEN,'Notion-Version':'2022-06-28','Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Smoke setup read failed: '+r.status);return r.json();}
          const rows=await notion(booksDb,{page_size:100});
          const ideas=await notion(ideasDb,{page_size:100,filter:{property:'Source key',rich_text:{is_not_empty:true}}});
          if(rows.has_more||ideas.has_more)throw Error('Smoke input pagination needs review.');
          let calls=0;const durations=[];
          for(const page of rows.results){const found=ideas.results.filter(i=>(i.properties.Book?.relation??[]).some(r=>r.id===page.id));if(!found.length)continue;const p=page.properties;const book={id:plain(p['Library ID']),title:plain(p.Name),author:plain(p.Author),formats:(p.Format?.multi_select??[]).map(f=>f.name),status:p.Status?.select?.name??'',notes:plain(p['App notes'])};
            for(let i=0;i<found.length;i+=5){const start=Date.now();let r;try{r=await fetch(base+'/backup/library-export',{method:'POST',headers:{Authorization:'Bearer '+process.env.CAPTURE_TOKEN,'Content-Type':'application/json',Origin:'https://librarymh.github.io'},body:JSON.stringify({books:[{...book,ideas:found.slice(i,i+5).map(x=>({key:plain(x.properties['Source key']),text:plain(x.properties.Idea)}))}]}),signal:AbortSignal.timeout(90000)});}catch(e){throw Error('Production transport failed at request '+(calls+1)+' after '+(Date.now()-start)+'ms: '+e.name);}
              const elapsed=Date.now()-start;console.log('Library production smoke',++calls,'HTTP',r.status,'duration_ms',elapsed,'cors',r.headers.get('access-control-allow-origin'));durations.push(elapsed);let data=await r.json().catch(()=>({}));if(!r.ok)throw Error('Production export failed: HTTP '+r.status+' '+String(data.error||'No JSON error').slice(0,300));if(data.books_created||data.books_updated||data.takeaways_created||data.takeaways_updated)throw Error('Smoke unexpectedly changed existing app-owned fields.');
            }
          }
          if(!calls)throw Error('No existing keyed records available for smoke.');console.log('Authenticated existing-row smoke passed',calls,'requests; max_ms',Math.max(...durations));
          JS
