name = "contact-capture"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The app itself (the ../public folder) is served from the same address as the API, so it works without GitHub Pages.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/v", "/capture", "/me", "/me/update", "/events", "/events/create", "/people/recent", "/people/update", "/people/delete", "/people/duplicates", "/people/merge", "/people/list", "/people/history", "/health", "/share-target"]

[vars]
# Extra origins allowed to call the API from another site (comma separated). The Worker's own address is always allowed,
# so this is only needed if you also host a copy of the app elsewhere, for example on GitHub Pages.
ALLOWED_ORIGIN = "https://mhoman05.github.io"
# Notion databases of the Work CRM (People, Companies, Interactions).
NOTION_PEOPLE_DB = "1af97b4b13734867b105b6afc71ff37f"
NOTION_COMPANIES_DB = "1bbdff67c9cb4035a19eee26e50abe48"
NOTION_INTERACTIONS_DB = "51d15aee672b41ebbe2fb1a948c23eca"
# "My sharing details": the details you may share about yourself (Work CRM page).
NOTION_ME_DB = "535e69c9ee2540a08bc72c326786e5d1"
# Events you meet people at (the Events database of the Work CRM).
NOTION_EVENTS_DB = "f1680991265045f2b99752fa79148c2a"
# Calendar meetings, shown in a person's history.
NOTION_MEETINGS_DB = "6311b06337a4468bb661111f32c063b2"
# MODEL = "claude-opus-5-5"   # optional override; this is the default

# Secrets, never put these in this file: ANTHROPIC_API_KEY, NOTION_TOKEN, CAPTURE_TOKEN
